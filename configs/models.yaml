# 4.5 — search spaces cố định trước khi tuning. Không mở rộng riêng cho model nào
# sau khi đã thấy kết quả final test (4.6.4).

random_forest:
  defaults: {n_estimators: 500, max_depth: null, min_samples_leaf: 5}
  space:
    n_estimators: [300, 500, 800]
    max_depth: [null, 6, 10, 16]
    min_samples_leaf: [1, 3, 5, 10]
    min_samples_split: [2, 5, 10]
    max_features: [sqrt, 0.3, 0.5]

lightgbm:
  defaults: {n_estimators: 400, learning_rate: 0.05, num_leaves: 15}
  space:
    n_estimators: [200, 400, 800]
    learning_rate: [0.02, 0.05, 0.1]
    num_leaves: [7, 15, 31]
    max_depth: [-1, 4, 6]
    min_child_samples: [10, 20, 40]
    colsample_bytree: [0.6, 0.8, 1.0]
    subsample: [0.7, 0.85, 1.0]
    subsample_freq: [1]

catboost:
  defaults: {iterations: 500, learning_rate: 0.05, depth: 4}
  space:
    iterations: [300, 500, 800]
    learning_rate: [0.02, 0.05, 0.1]
    depth: [3, 4, 6]
    l2_leaf_reg: [1, 3, 10]

tcn:                                # model chuỗi đang giữ lại
  defaults: {lookback: 12, channels: 32, kernel_size: 3, dilations: [1, 2, 4],
             dropout: 0.1, learning_rate: 0.001, batch_size: 64, max_epochs: 100, patience: 10}
  space:
    lookback: [4, 8, 12]
    channels: [16, 32, 64]
    kernel_size: [2, 3]
    dropout: [0.1, 0.2, 0.3]
    learning_rate: [0.0003, 0.001, 0.003]
  refit_every: 4
  n_repeats: 5
